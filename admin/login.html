<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sawari — Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/styles.css" />
  <style>
    .pw-wrap {
      position: relative;
    }
    .pw-wrap .sa-input {
      padding-inline-end: 2.75rem;
      width: 100%;
    }
    .pw-toggle {
      position: absolute;
      inset-inline-end: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--sa-muted);
      padding: 0;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }
    .pw-icon-hide { display: none; }
  </style>
</head>
<body class="admin-body">
  <div class="sa-login-wrap">
    <div class="sa-login-box">

      <div class="sa-login-logo">
        <div class="logo-mark">S</div>
        <span class="logo-text">Sawari Admin</span>
      </div>

      <h2 class="sa-login-title">Welcome back</h2>
      <p class="sa-login-sub">Sign in to manage your content.</p>

      <form id="adminLoginForm" class="sa-form-grid" novalidate>
        <label class="sa-label">
          Email
          <input id="email" class="sa-input" name="email" type="email" autocomplete="username" placeholder="sales@sawari.com" required />
        </label>

        <label class="sa-label">
          Password
          <div class="pw-wrap">
            <input id="password" class="sa-input" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
            <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password" title="Show / hide password">
              <!-- Eye icon (shown when password is hidden) -->
              <svg id="iconShow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <!-- Eye-off icon (shown when password is visible) -->
              <svg id="iconHide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="pw-icon-hide"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </label>

        <button type="submit" class="sa-btn sa-btn-gold sa-btn-full">
          Sign In
        </button>

        <div id="loginStatus" role="status" aria-live="polite"></div>
      </form>

    </div>
  </div>

  <script>
    // Show / hide password
    const pwInput  = document.getElementById('password');
    const pwToggle = document.getElementById('pwToggle');
    const iconShow = document.getElementById('iconShow');
    const iconHide = document.getElementById('iconHide');

    pwToggle.addEventListener('click', () => {
      const visible = pwInput.type === 'text';
      pwInput.type  = visible ? 'password' : 'text';
      iconShow.classList.toggle('pw-icon-hide', !visible);
      iconHide.classList.toggle('pw-icon-hide', visible);
      pwToggle.setAttribute('aria-label', visible ? 'Show password' : 'Hide password');
    });

    // Login form
    const form   = document.getElementById('adminLoginForm');
    const status = document.getElementById('loginStatus');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      status.textContent = '';
      status.className   = '';

      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';

      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: form.email.value.trim(), password: form.password.value })
        });

        const body = await response.json().catch(() => ({}));

        if (!response.ok) {
          status.textContent = body.error || 'Invalid email or password.';
          status.className   = 'error';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
          return;
        }

        status.textContent = 'Logged in — redirecting…';
        status.className   = 'success';
        window.location.href = '/admin/dashboard-en.html';
      } catch {
        status.textContent = 'Network error. Is the server running?';
        status.className   = 'error';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
