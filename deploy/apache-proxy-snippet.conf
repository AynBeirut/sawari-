# ============================================================
#  Sawari — Apache Reverse Proxy Snippet for Webuzo
#
#  Paste this into Webuzo:
#    Apache → Virtual Hosts → indigo-ca.com → Custom Configuration
#
#  This proxies all traffic from indigo-ca.com → Node.js on port 3000
# ============================================================

ProxyRequests       Off
ProxyPreserveHost   On

ProxyPass           /  http://127.0.0.1:30000/
ProxyPassReverse    /  http://127.0.0.1:300000/

RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Port  "443"
